name: Commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: 'tools/commitlint/go.mod'
          cache: true
      - name: Validate PR Commits
        working-directory: tools/commitlint
        run: |
          go run ./cmd/commitlint --format github
