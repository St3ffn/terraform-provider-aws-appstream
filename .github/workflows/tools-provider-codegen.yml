name: Tool Provider Codegen

on:
  pull_request:
    paths:
      - '.golangci.yaml'
      - 'tools/provider-codegen/**'
      - '.github/workflows/tools-provider-codegen.yml'
      - '!tools/provider-codegen/README.md'
  push:
    branches:
      - main
    paths:
      - '.golangci.yaml'
      - 'tools/provider-codegen/**'
      - '.github/workflows/tools-provider-codegen.yml'
      - '!tools/provider-codegen/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Provider Codegen Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/provider-codegen
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'tools/provider-codegen/go.mod'
          cache: true
      - name: Run Linters
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest
          working-directory: tools/provider-codegen
      - run: go mod download
      - run: go test -v -cover -timeout 10m ./...
