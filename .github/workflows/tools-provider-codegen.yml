name: Tool Provider Codegen

on:
  pull_request:
    paths:
      - '.golangci.yaml'
      - 'tools/provider-codegen/**'
      - '.github/workflows/tools-provider-codegen.yml'
      - '!tools/provider-codegen/README.md'
  push:
    branches:
      - main
    paths:
      - '.golangci.yaml'
      - 'tools/provider-codegen/**'
      - '.github/workflows/tools-provider-codegen.yml'
      - '!tools/provider-codegen/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Provider Codegen Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/provider-codegen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'tools/provider-codegen/go.mod'
          cache: true
      - name: Run Linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: tools/provider-codegen
      - run: go mod download
      - run: go test -v -cover -timeout 10m ./...
